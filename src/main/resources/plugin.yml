name: CustomCropsPump
version: '${project.version}'
main: com.liu.ccpump.CustomCropsPumpPlugin
api-version: '1.21'
load: POSTWORLD
authors: [Liu]
description: 为 CustomCrops 洒水器自动供水的水泵与水管
depend: [CustomCrops]
softdepend: [CraftEngine]
folia-supported: false

# SQLite 驱动由 Paper 启动时自动下载（不打进插件 jar）
libraries:
  - org.xerial:sqlite-jdbc:3.46.0.0

commands:
  ccpump:
    description: CustomCropsPump 管理命令
    usage: /ccpump help
    aliases: [ccp, waterpump]

permissions:
  customcropspump.admin:
    description: 重载配置、保存数据、给予水泵/水管
    default: op
  customcropspump.use:
    description: 使用水泵与水管
    default: true
