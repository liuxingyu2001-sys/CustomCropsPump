  &b/ccpump reload &7- 重载配置
  &b/ccpump save &7- 立即保存数据
  &b/ccpump info &7- 查看已登记的水泵/水管数量
  &b/ccpump give <水泵类型|水管类型> [玩家] [数量] &7- 给予物品
