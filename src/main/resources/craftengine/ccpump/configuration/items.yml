# 注意：水管还有 64 个按连接方向切换外观的变体物品，
# 由 tools/generate_pipe_variants.py 生成到 pipe_variants.yml。
# 不要在这里手工添加 ccpump:water_pipe_<数字>。
items:
  ccpump:water_pump:
    material: paper
    data:
      item-name: <!i><gold>水泵</gold>
    model: ccpump:block/water_pump
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      ignore-placer: false
      ignore-entities: false
      furniture:
        settings:
          item: ccpump:water_pump
          sounds:
            break: minecraft:block.copper.break
            place: minecraft:block.copper.place
        variants:
          ground:
            loot-spawn-offset: 0,0.5,0
            elements:
              - item: ccpump:water_pump
                display-transform: NONE
                billboard: FIXED
                translation: 0,0.5,0
            hitboxes:
              # 右键交互范围
              - type: interaction
                can-use-item-on: false
                can-be-hit-by-projectile: false
                blocks-building: false
                position: 0,0,0
                scale: 0.9,0.9
                interactive: true
                invisible: false
              # 实体碰撞箱：玩家走不过去、可以站上去
              # （interaction 只负责点击，不带碰撞）
              - type: shulker
                can-use-item-on: false
                blocks-building: true
                can-be-hit-by-projectile: false
                position: 0,0,0
                scale: 0.9
                peek: 0
                interactive: false
                interaction-entity: false
                invisible: true
        loot:
          template: default:loot_table/basic
          arguments:
            item: ccpump:water_pump

  ccpump:water_pipe:
    material: paper
    data:
      item-name: <!i><gold>水管</gold>
    model: ccpump:block/water_pipe
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
      ignore-placer: false
      ignore-entities: false
      furniture:
        settings:
          item: ccpump:water_pipe
          sounds:
            break: minecraft:block.copper.break
            place: minecraft:block.copper.place
        variants:
          ground:
            loot-spawn-offset: 0,0.5,0
            elements:
              - item: ccpump:water_pipe
                display-transform: NONE
                billboard: FIXED
                translation: 0,0.5,0
            hitboxes:
              # 右键交互范围；允许对着水管放方块，方便往上/旁边接管道
              - type: interaction
                can-use-item-on: true
                can-be-hit-by-projectile: false
                blocks-building: false
                position: 0,0,0
                scale: 0.9,0.55
                interactive: true
                invisible: false
              # 实体碰撞箱：细管只占中间一小块
              - type: shulker
                can-use-item-on: false
                blocks-building: true
                can-be-hit-by-projectile: false
                position: 0,0.25,0
                scale: 0.5
                peek: 0
                interactive: false
                interaction-entity: false
                invisible: true
        loot:
          template: default:loot_table/basic
          arguments:
            item: ccpump:water_pipe
