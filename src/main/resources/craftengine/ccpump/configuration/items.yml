# ============================================================
#  由 tools/generate_pipe_variants.py 自动生成，请勿手工编辑。
#
#  水泵 / 水管是 CraftEngine **实体家具**（furniture），不是方块：
#    · 不占用原版方块状态，不受各状态组槽位数量限制
#    · 用 shulker 碰撞箱提供碰撞，走不过去、也能站上去
#    · 实体不是方块，所以不挡水、也参与方块面剔除
#  水管的 4 种外观形态见 pipe_variants.yml。
# ============================================================
items:
  ccpump:water_pump:
    material: paper
    data:
      item-name: <!i><gold>水泵</gold>
    model: ccpump:block/water_pump
    behavior:
      type: furniture_item
      rules:
        ground:
          rotation: four
          alignment: center
        wall:
          rotation: four
          alignment: center
        ceiling:
          rotation: four
          alignment: center
      ignore-placer: false
      ignore-entities: false
      furniture:
        settings:
          item: ccpump:water_pump
          sounds:
            break: minecraft:block.copper.break
            place: minecraft:block.copper.place
        variants:
          ground:
            loot-spawn-offset: 0,0.5,0
            elements:
              - item: ccpump:water_pump
                display-transform: NONE
                billboard: FIXED
                translation: 0,0.5,0
            hitboxes:
              # 水泵用 shulker 碰撞箱提供真实碰撞，同时它自己就是右键交互
              # 的判定箱（不额外加 interaction，避免两个判定箱重叠点不到）。
              # can-use-item-on: false 表示手持方块右键时优先走水泵交互
              # （打开界面 / 充能），而不是把方块放下去。
              - type: shulker
                can-use-item-on: false
                blocks-building: true
                can-be-hit-by-projectile: false
                position: 0,0,0
                scale: 0.9
                peek: 0
                interactive: true
                interaction-entity: true
                invisible: true
          # 贴墙放置：模型往墙面方向收一点，碰撞箱略小
          wall:
            loot-spawn-offset: 0,0.5,0
            elements:
              - item: ccpump:water_pump
                display-transform: NONE
                billboard: FIXED
                translation: 0,0.5,0
            hitboxes:
              - type: shulker
                can-use-item-on: false
                blocks-building: true
                can-be-hit-by-projectile: false
                position: 0,0,0
                scale: 0.7
                peek: 0
                interactive: true
                interaction-entity: true
                invisible: true
          # 吊在天花板下
          ceiling:
            loot-spawn-offset: 0,0.5,0
            elements:
              - item: ccpump:water_pump
                display-transform: NONE
                billboard: FIXED
                translation: 0,0.5,0
            hitboxes:
              - type: shulker
                can-use-item-on: false
                blocks-building: true
                can-be-hit-by-projectile: false
                position: 0,0,0
                scale: 0.7
                peek: 0
                interactive: true
                interaction-entity: true
                invisible: true
        loot:
          template: default:loot_table/basic
          arguments:
            item: ccpump:water_pump

